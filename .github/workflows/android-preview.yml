name: CELICOR Android Preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/build-trigger'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - run: npx expo-doctor
      - run: npx expo prebuild --clean --no-install --platform android
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Create preview signing key
        shell: bash
        run: |
          keytool -genkeypair -v -storetype PKCS12 -keystore preview.jks -alias celicor-preview -keyalg RSA -keysize 2048 -validity 10000 -storepass preview123456 -keypass preview123456 -dname 'CN=CELICOR Preview, OU=Mobile, O=CELICOR, L=Caracas, S=DC, C=VE'
          cat > credentials.json <<'JSON'
          {"android":{"keystore":{"keystorePath":"preview.jks","keystorePassword":"preview123456","keyAlias":"celicor-preview","keyPassword":"preview123456"}}}
          JSON
      - name: Start EAS APK build
        shell: bash
        run: |
          set +e
          eas build --platform android --profile preview --non-interactive --no-wait --json > /tmp/eas-build.json 2> /tmp/eas-build.err
          code=$?
          set -e
          node <<'NODE'
          const fs=require('fs');
          let build={};
          try { const parsed=JSON.parse(fs.readFileSync('/tmp/eas-build.json','utf8')); build=Array.isArray(parsed)?parsed[0]||{}:parsed; } catch {}
          const err=fs.existsSync('/tmp/eas-build.err')?fs.readFileSync('/tmp/eas-build.err','utf8'):'';
          const url=build.id?`https://expo.dev/accounts/jamz979712/projects/celicor-la-castellana/builds/${build.id}`:'';
          fs.writeFileSync('BUILD_LATEST.md',`# CELICOR Android Preview\n\nBuild ID: ${build.id||'not-created'}\n\nStatus: ${build.status||'unknown'}\n\n${url?`Expo: ${url}\n\n`:''}${err?`## EAS output\n\n\`\`\`text\n${err.slice(-5000)}\n\`\`\`\n`:''}`);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BUILD_LATEST.md
          git commit -m 'ci: record latest CELICOR APK build' || true
          git push origin HEAD:main || true
          exit $code
