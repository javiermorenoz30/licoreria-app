name: Build Android Preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Java for Android signing
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Ensure EAS project is linked
        run: eas init --force --non-interactive

      - name: Create temporary preview signing key
        run: |
          keytool -genkeypair \
            -v \
            -storetype JKS \
            -keystore preview.keystore \
            -alias celicor-preview \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass celicor-preview-2026 \
            -keypass celicor-preview-2026 \
            -dname "CN=CELICOR Preview, OU=Mobile, O=CELICOR La Castellana, L=Caracas, C=VE"

          cat > credentials.json <<'JSON'
          {
            "android": {
              "keystore": {
                "keystorePath": "preview.keystore",
                "keystorePassword": "celicor-preview-2026",
                "keyAlias": "celicor-preview",
                "keyPassword": "celicor-preview-2026"
              }
            }
          }
          JSON

      - name: Trigger Android APK build
        run: eas build --platform android --profile preview --non-interactive --no-wait
