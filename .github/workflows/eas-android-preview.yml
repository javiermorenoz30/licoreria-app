name: Build Android Preview APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/build-apk-trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Java for Android signing
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Link EAS project
        id: init
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p builds
          set +e
          eas init --force --non-interactive > builds/eas-init.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Create temporary preview signing key
        if: steps.init.outputs.exit_code == '0'
        run: |
          keytool -genkeypair \
            -v \
            -storetype JKS \
            -keystore preview.keystore \
            -alias celicor-preview \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass celicor-preview-2026 \
            -keypass celicor-preview-2026 \
            -dname "CN=CELICOR Preview, OU=Mobile, O=CELICOR La Castellana, L=Caracas, C=VE"

          cat > credentials.json <<'JSON'
          {
            "android": {
              "keystore": {
                "keystorePath": "preview.keystore",
                "keystorePassword": "celicor-preview-2026",
                "keyAlias": "celicor-preview",
                "keyPassword": "celicor-preview-2026"
              }
            }
          }
          JSON

      - name: Start Android APK build
        id: easbuild
        if: steps.init.outputs.exit_code == '0'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          eas build --platform android --profile preview --non-interactive --no-wait --json > builds/eas-build.json 2> builds/eas-build-error.log
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write build status
        shell: bash
        run: |
          init_code='${{ steps.init.outputs.exit_code }}'
          build_code='${{ steps.easbuild.outputs.exit_code }}'
          {
            echo "CELICOR Android preview build"
            echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "EAS init exit code: ${init_code:-not-run}"
            echo "EAS build exit code: ${build_code:-not-run}"
          } > builds/latest-status.txt

      - name: Persist EAS project link and build result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.json builds/eas-init.log builds/eas-build.json builds/eas-build-error.log builds/latest-status.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'ci: record Android preview build result'
          git push
