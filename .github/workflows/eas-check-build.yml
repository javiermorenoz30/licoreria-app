name: Check EAS Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/check-build-trigger'
  pull_request:
    branches: [main]
    paths:
      - '.github/check-build-trigger'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install app dependencies
        run: npm install

      - name: Read latest Android builds
        shell: bash
        run: |
          mkdir -p builds
          eas build:list --platform android --limit 10 --json --non-interactive > builds/eas-builds-current.json

      - name: Download target EAS prebuild log
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const builds = JSON.parse(fs.readFileSync('builds/eas-builds-current.json','utf8'));
          const targetId = '393ce2d3-391c-4deb-91e0-f46ed9f4f1af';
          const target = builds.find(b => b.id === targetId) || builds.find(b => b.status === 'ERRORED') || builds[0] || {};
          fs.writeFileSync('builds/latest-build-summary.json', JSON.stringify({
            id: target.id,
            status: target.status,
            error: target.error || null,
            appIdentifier: target.appIdentifier,
            createdAt: target.createdAt,
            completedAt: target.completedAt
          }, null, 2));
          if (target.logFiles?.[0]) fs.writeFileSync('/tmp/eas-log-url.txt', target.logFiles[0]);
          NODE
          if [ -s /tmp/eas-log-url.txt ]; then
            curl --compressed --fail --location --silent --show-error "$(cat /tmp/eas-log-url.txt)" -o builds/eas-target-build.log
          fi
          echo '===== TARGET EAS BUILD SUMMARY ====='
          cat builds/latest-build-summary.json
          echo '===== TARGET EAS BUILD LOG ====='
          if [ -f builds/eas-target-build.log ]; then cat builds/eas-target-build.log; else echo 'No target EAS log downloaded'; fi

      - name: Persist status and diagnostic log
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/eas-builds-current.json builds/latest-build-summary.json builds/eas-target-build.log 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'ci: capture target EAS prebuild diagnostics'
          git push origin HEAD:main
