name: Check EAS Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/check-build-trigger'
  pull_request:
    branches: [main]
    paths:
      - '.github/check-build-trigger'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install app dependencies
        run: npm install

      - name: Read latest Android builds
        shell: bash
        run: |
          mkdir -p builds
          eas build:list --platform android --limit 5 --json --non-interactive > builds/eas-builds-current.json
          cat builds/eas-builds-current.json

      - name: Download latest EAS build log
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const builds = JSON.parse(fs.readFileSync('builds/eas-builds-current.json','utf8'));
          const latest = builds[0] || {};
          fs.writeFileSync('builds/latest-build-summary.json', JSON.stringify({
            id: latest.id,
            status: latest.status,
            error: latest.error || null,
            appIdentifier: latest.appIdentifier,
            createdAt: latest.createdAt,
            completedAt: latest.completedAt
          }, null, 2));
          if (!latest.logFiles?.[0]) process.exit(0);
          fs.writeFileSync('/tmp/eas-log-url.txt', latest.logFiles[0]);
          NODE
          if [ -s /tmp/eas-log-url.txt ]; then
            curl --compressed --fail --location --silent --show-error "$(cat /tmp/eas-log-url.txt)" -o builds/eas-latest-build.log || true
          fi
          echo '===== LATEST EAS BUILD SUMMARY ====='
          cat builds/latest-build-summary.json
          echo '===== LATEST EAS BUILD LOG ====='
          if [ -f builds/eas-latest-build.log ]; then file builds/eas-latest-build.log || true; cat builds/eas-latest-build.log; else echo 'No EAS log file downloaded'; fi

      - name: Persist status and diagnostic log
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/eas-builds-current.json builds/latest-build-summary.json builds/eas-latest-build.log 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'ci: capture latest EAS Android build diagnostics'
          git push origin HEAD:main
