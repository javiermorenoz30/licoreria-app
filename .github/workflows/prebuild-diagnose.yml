name: Diagnose Expo Prebuild

on:
  push:
    branches: [main]
    paths:
      - '.github/prebuild-diagnose-trigger'
  pull_request:
    branches: [main]
    paths:
      - '.github/prebuild-diagnose-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Expo doctor
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p diagnostics
          npx expo-doctor > diagnostics/expo-doctor.txt 2>&1 || true
          cat diagnostics/expo-doctor.txt

      - name: Run Android prebuild
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx expo prebuild --no-install --platform android > diagnostics/prebuild.txt 2>&1
          code=$?
          echo "$code" > diagnostics/prebuild-exit-code.txt
          cat diagnostics/prebuild.txt
          exit 0

      - name: Persist diagnostics
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/expo-doctor.txt diagnostics/prebuild.txt diagnostics/prebuild-exit-code.txt
          git diff --cached --quiet && exit 0
          git commit -m 'ci: capture Expo prebuild diagnostics'
          git push origin HEAD:main
