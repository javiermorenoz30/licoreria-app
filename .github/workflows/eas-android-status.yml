name: CELICOR Android APK Build Status

on:
  push:
    branches:
      - main
    paths:
      - .eas-build-trigger-status
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Create temporary preview signing key
        run: |
          keytool -genkeypair \
            -v \
            -storetype JKS \
            -keystore preview.keystore \
            -alias celicor-preview \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass celicor-preview-2026 \
            -keypass celicor-preview-2026 \
            -dname "CN=CELICOR Preview, OU=Mobile, O=CELICOR La Castellana, L=Caracas, C=VE"

          cat > credentials.json <<'JSON'
          {
            "android": {
              "keystore": {
                "keystorePath": "preview.keystore",
                "keystorePassword": "celicor-preview-2026",
                "keyAlias": "celicor-preview",
                "keyPassword": "celicor-preview-2026"
              }
            }
          }
          JSON

      - name: Initialize EAS and launch APK build
        id: eas
        shell: bash
        run: |
          set +e
          INIT_OUTPUT=$(eas init --force --non-interactive 2>&1)
          INIT_CODE=$?

          BUILD_OUTPUT="Build not started because EAS initialization failed."
          BUILD_CODE=99
          if [ "$INIT_CODE" -eq 0 ]; then
            BUILD_OUTPUT=$(eas build --platform android --profile preview --non-interactive --no-wait 2>&1)
            BUILD_CODE=$?
          fi

          {
            echo "# CELICOR Android build status"
            echo
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "## EAS init"
            echo "Exit code: $INIT_CODE"
            echo '```text'
            printf '%s\n' "$INIT_OUTPUT"
            echo '```'
            echo
            echo "## Android preview build"
            echo "Exit code: $BUILD_CODE"
            echo '```text'
            printf '%s\n' "$BUILD_OUTPUT"
            echo '```'
          } > BUILD_STATUS.md

          exit 0

      - name: Save build status to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_STATUS.md app.json
          git commit -m "ci: record CELICOR APK build launch status" || exit 0
          git push
